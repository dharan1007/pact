name: deploy-production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character PACT commit SHA to promote
        required: true
        type: string
  push:
    branches: [production-release]

permissions:
  contents: read
  checks: read

env:
  VERCEL_ORG_ID: team_APBZJjf6iizHCTuseqHosFnU
  VERCEL_PROJECT_ID: prj_4a7E35CAWFjsdq04HieKX5VUvv6V
  PACT_PRODUCTION_URL: https://pact-webmcp.vercel.app
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

concurrency:
  group: pact-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy exact verified release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read production release request
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: production-release
          fetch-depth: 1
          sparse-checkout: release-request.json
          sparse-checkout-cone-mode: false

      - name: Resolve and validate release request
        id: release
        env:
          PACT_EVENT_NAME: ${{ github.event_name }}
          PACT_DISPATCH_SHA: ${{ inputs.release_sha }}
          PACT_RELEASE_ACTOR: ${{ github.actor }}
          PACT_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const eventName = process.env.PACT_EVENT_NAME;
          let releaseSha = process.env.PACT_DISPATCH_SHA || '';
          if (eventName === 'push') {
            if (process.env.PACT_RELEASE_ACTOR !== process.env.PACT_REPOSITORY_OWNER) {
              console.error('PACT_RELEASE_PUSH_ACTOR_FORBIDDEN');
              process.exit(1);
            }
            let request;
            try {
              request = JSON.parse(fs.readFileSync('release-request.json', 'utf8'));
            } catch {
              console.error('PACT_RELEASE_REQUEST_INVALID');
              process.exit(1);
            }
            const valid = request && request.schema === 1
              && typeof request.releaseSha === 'string'
              && /^[0-9a-f]{40}$/.test(request.releaseSha)
              && typeof request.nonce === 'string'
              && /^[A-Za-z0-9._-]{16,128}$/.test(request.nonce)
              && Object.keys(request).every(key => ['schema', 'releaseSha', 'nonce'].includes(key));
            if (!valid) {
              console.error('PACT_RELEASE_REQUEST_INVALID');
              process.exit(1);
            }
            releaseSha = request.releaseSha;
          }
          if (!/^[0-9a-f]{40}$/.test(releaseSha)) {
            console.error('PACT_RELEASE_SHA_INVALID');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_sha=${releaseSha}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PACT_SOURCE_COMMIT=${releaseSha}\n`);
          NODE

      - name: Validate deploy credential
        env:
          PACT_SOURCE_COMMIT: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${PACT_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PACT_RELEASE_SHA_INVALID" >&2
            exit 1
          fi
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN_REQUIRED" >&2
            exit 1
          fi

      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0
          clean: true

      - name: Prove checkout is the current hardening head
        env:
          PACT_SOURCE_COMMIT: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PACT_SOURCE_COMMIT}" || {
            echo "PACT_RELEASE_CHECKOUT_MISMATCH" >&2
            exit 1
          }
          git fetch --no-tags origin hardening/real-rest-provider-20260905
          test "${PACT_SOURCE_COMMIT}" = "$(git rev-parse FETCH_HEAD)" || {
            echo "PACT_RELEASE_NOT_CURRENT_HARDENING_HEAD" >&2
            exit 1
          }

      - name: Require successful verification for exact release
        env:
          GH_TOKEN: ${{ github.token }}
          PACT_SOURCE_COMMIT: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          successes="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PACT_SOURCE_COMMIT}/check-runs" \
            --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success")] | length')"
          if [[ "${successes}" -lt 1 ]]; then
            echo "PACT_RELEASE_CI_NOT_GREEN" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository before deployment
        run: npm run verify

      - name: Pull production project configuration
        run: npx --yes vercel@59.11.7 pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Export production smoke configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 env pull .pact-production.env --yes --environment=production --token="${VERCEL_TOKEN}"
          test -s .pact-production.env || {
            echo "PACT_PRODUCTION_ENV_PULL_FAILED" >&2
            exit 1
          }

      - name: Build production artifact
        run: npx --yes vercel@59.11.7 build --prod --token="${VERCEL_TOKEN}"

      - name: Verify exact prebuilt artifact
        run: npm run verify:prebuilt

      - name: Stage production-configured artifact without assigning production domains
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            npx --yes vercel@59.11.7 deploy --prebuilt --prod --skip-domain \
              --env PACT_SOURCE_COMMIT=${PACT_SOURCE_COMMIT} \
              --token="${VERCEL_TOKEN}" \
              | tail -n 1
          )"
          if [[ ! "${deployment_url}" =~ ^https://[^[:space:]]+\.vercel\.app$ ]]; then
            echo "PACT_STAGED_DEPLOYMENT_URL_INVALID" >&2
            exit 1
          fi
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify immutable staged deployment before promotion
        env:
          PACT_PRODUCTION_URL: ${{ steps.stage.outputs.deployment_url }}
          PACT_EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: npm run verify:production

      - name: Execute real provider transaction before promotion
        env:
          PACT_PRODUCTION_URL: ${{ steps.stage.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.pact-production.env scripts/verify-production-smoke.mjs

      - name: Remove pulled production environment
        if: always()
        shell: bash
        run: rm -f .pact-production.env

      - name: Promote verified staged deployment
        run: >-
          npx --yes vercel@59.11.7 promote ${{ steps.stage.outputs.deployment_url }} --yes
          --token="${VERCEL_TOKEN}"

      - name: Verify live production alias after promotion
        env:
          PACT_EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: npm run verify:production

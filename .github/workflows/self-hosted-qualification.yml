name: self-hosted-qualification

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA to qualify (blank uses current main)
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  verify:
    name: self-hosted qualification verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, production-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Bind qualification to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          test "$head" = "$main" || { echo "PACT_QUALIFICATION_NOT_CURRENT_MAIN"; exit 1; }
          requested='${{ inputs.sha }}'
          if [ -n "$requested" ]; then
            test "$requested" = "$head" || { echo "PACT_QUALIFICATION_SHA_MISMATCH"; exit 1; }
          fi
          echo "PACT_SOURCE_COMMIT=$head" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Dependency security gate
        run: npm audit --audit-level=high --omit=dev
      - name: Full branch verification
        run: npm run verify
      - name: Verify packaged organisational provider surface
        run: |
          for required in \
            dist/sdk/provider-driver.js \
            dist/sdk/provider-assurance.js \
            dist/sdk/provider-policy.js \
            dist/sdk/provider-qualification.js \
            dist/sdk/provider-qualification-suite.js \
            dist/sdk/provider-qualification-report.js \
            dist/sdk/providers/etag-json.js \
            dist/sdk/providers/kubernetes-resource.js \
            dist/sdk/providers/idempotent-command.js \
            dist/sdk/providers/versioned-command.js; do
            test -s "$required" || { echo "PACT_RELEASE_MISSING:$required"; exit 1; }
          done
      - name: Build exact Vercel output
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "PACT_VERCEL_TOKEN_REQUIRED"; exit 1; }
          npx --yes vercel@59.11.7 pull --yes --environment=preview --token "$VERCEL_TOKEN"
          PACT_SOURCE_COMMIT="$PACT_SOURCE_COMMIT" npx --yes vercel@59.11.7 build --token "$VERCEL_TOKEN"
          PACT_SOURCE_COMMIT="$PACT_SOURCE_COMMIT" npm run verify:prebuilt
      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-self-hosted-verify-${{ github.sha }}
          path: |
            dist/release-manifest.json
            dist/release-provenance.json
            dist/sbom.cdx.json
            .vercel/output/config.json
          retention-days: 30
          if-no-files-found: error

  codeql:
    name: self-hosted qualification codeql
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, production-ci]
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Bind CodeQL to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          test "$head" = "$main" || { echo "PACT_CODEQL_NOT_CURRENT_MAIN"; exit 1; }
          requested='${{ inputs.sha }}'
          if [ -n "$requested" ]; then
            test "$requested" = "$head" || { echo "PACT_CODEQL_SHA_MISMATCH"; exit 1; }
          fi
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          category: /language:javascript-typescript
